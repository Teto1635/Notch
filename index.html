<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F3F0">
<meta name="description" content="Notlar, iş takibi ve hatırlatmalar. / Notes, tracking and reminders.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preload" href="./archivo.woff2" as="font" type="font/woff2" crossorigin>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Çentik">
<title>Çentik</title>
<style>
/* ======================================================================
   ÇENTİK — görsel dil: şerit metre. Sarı şerit + siyah çentikler tek
   vurgu; geri kalan her şey sakin, nötr. Yazı: Archivo (genişlik ekseni
   rakamlarda daralır, metinde normal kalır).
   ====================================================================== */
@font-face{
  font-family:"Archivo"; src:url("./archivo.woff2") format("woff2");
  font-weight:400 800; font-stretch:62% 100%; font-style:normal; font-display:swap;
}
:root{
  --tape:#FFCF24; --tape-ink:#18170E; --tape-dim:#E2B40C;
  --bg:#F2F3F0; --surface:#FFFFFF; --sunk:#E8EAE6;
  --ink:#17191B; --ink2:#3F4549; --muted:#636A6F;
  --line:#D3D6D1; --line2:#E4E6E2;
  --red:#BF251D; --red-soft:#FBE7E4;
  --focus:#17191B; --scrim:rgba(18,20,22,.46);
  --chip-l:94.5%; --chip-c:.04; --chip-tl:37%; --chip-tc:.115;
  --font:"Archivo","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --tape:#F7C61C; --tape-ink:#18170E; --tape-dim:#C99C06;
    --bg:#1A1C1E; --surface:#222528; --sunk:#141618;
    --ink:#EDEEEA; --ink2:#CDD0CC; --muted:#9CA2A5;
    --line:#3C4145; --line2:#2E3236;
    --red:#FF7C6D; --red-soft:#3A2321;
    --focus:#F7C61C; --scrim:rgba(0,0,0,.62);
    --chip-l:31%; --chip-c:.05; --chip-tl:87%; --chip-tc:.09;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --tape:#F7C61C; --tape-ink:#18170E; --tape-dim:#C99C06;
  --bg:#1A1C1E; --surface:#222528; --sunk:#141618;
  --ink:#EDEEEA; --ink2:#CDD0CC; --muted:#9CA2A5;
  --line:#3C4145; --line2:#2E3236;
  --red:#FF7C6D; --red-soft:#3A2321;
  --focus:#F7C61C; --scrim:rgba(0,0,0,.62);
  --chip-l:31%; --chip-c:.05; --chip-tl:87%; --chip-tc:.09;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.45 var(--font); font-stretch:100%;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none}
button,input,select,textarea{font:inherit; font-stretch:inherit; color:inherit; letter-spacing:inherit}
button{cursor:pointer; border:0; background:none; padding:0; -webkit-tap-highlight-color:transparent; text-align:inherit; touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
::placeholder{color:var(--muted); opacity:1}
[hidden]{display:none!important}
.vh{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
svg{display:block}

/* ---------- kabuk ---------- */
.app{max-width:720px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}
.head{position:sticky; top:0; z-index:20; background:var(--bg)}   /* arama çubuğu + çalan hatırlatmalar: liste kaydırılsa da görünür */
.top{display:flex; align-items:center; gap:6px;
  padding:calc(var(--safe-t) + 10px) 10px 10px 12px; border-bottom:1px solid var(--line2)}
.brand{display:flex; align-items:center; gap:9px; flex:none; margin-right:4px;
  font-size:22px; font-weight:800; font-stretch:72%; line-height:1}
.brand svg{width:34px; height:34px}
.brand b{display:none; font-weight:inherit}
@media (min-width:600px){ .brand b{display:inline} }
.search{flex:1; min-width:0; position:relative}
.search input{width:100%; height:42px; border:1px solid var(--line); background:var(--surface); border-radius:8px;
  padding:0 10px 0 38px; font-size:16px}
.search svg{position:absolute; left:10px; top:11px; width:20px; height:20px; color:var(--muted); pointer-events:none}
.ib{width:42px; height:42px; display:grid; place-items:center; border-radius:8px; color:var(--ink2); position:relative; flex:none}
.ib svg{width:22px; height:22px}
@media (hover:hover){ .ib:hover{background:var(--sunk)} }
.ib .dot{position:absolute; top:6px; right:5px; width:11px; height:11px; border-radius:50%;
  background:var(--tape); border:1.5px solid var(--tape-ink)}
.ib .dot.bad{background:var(--red); border-color:var(--bg)}

main{flex:1; display:flex; flex-direction:column}
main > *{flex:1; padding-bottom:calc(96px + var(--safe-b))}

/* ---------- bildirim şeritleri ---------- */
.banner{display:flex; align-items:center; gap:10px; padding:10px 12px 10px 14px; font-size:14.5px; line-height:1.35;
  border-bottom:1px solid var(--line2); background:var(--surface)}
.banner p{margin:0; flex:1; min-width:0}
.banner .act{flex:none; font-weight:680; font-size:14px; padding:8px 12px; border-radius:6px; border:1.5px solid currentColor}
.banner .x{flex:none; width:40px; height:40px; display:grid; place-items:center; border-radius:6px}
.banner .x svg{width:18px; height:18px}
.banner.warn{background:var(--tape); color:var(--tape-ink); border-bottom-color:var(--tape-ink)}
.banner.bad{background:var(--red-soft)}
.banner.bad p b{color:var(--red)}
#rings:not(:empty){padding-bottom:8px; border-bottom:1px solid var(--line2)}
.ring{margin:8px 12px 0; padding:12px 12px 12px 14px; background:var(--tape); color:var(--tape-ink);
  border:1.5px solid var(--tape-ink); border-radius:10px; box-shadow:0 3px 0 var(--tape-ink);
  display:grid; grid-template-columns:auto 1fr; gap:4px 12px; align-items:center}
.ring-t{font-size:24px; font-weight:780; font-stretch:64%; font-variant-numeric:tabular-nums; line-height:1}
.ring-n{font-weight:650; overflow-wrap:anywhere}
.ring-a{grid-column:1 / -1; display:flex; gap:8px; margin-top:6px}
.ring-a button{font-weight:680; font-size:14px; padding:8px 12px; border-radius:6px; border:1.5px solid var(--tape-ink)}
.ring-a button.solid{background:var(--tape-ink); color:var(--tape)}
.ring :focus-visible,.banner.warn :focus-visible{outline-color:var(--tape-ink)}   /* sarı zeminde koyu çerçeve */

/* ---------- alt çubuk ---------- */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; pointer-events:none}
.tabs-in{max-width:720px; margin:0 auto; display:grid; grid-template-columns:1fr auto 1fr; align-items:end;
  background:var(--surface); border-top:1px solid var(--line); padding:0 8px var(--safe-b); pointer-events:auto}
.tab{height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:13px; font-weight:620; color:var(--muted); position:relative}
.tab svg{width:22px; height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:""; position:absolute; top:-1px; left:50%; width:40px; height:5px; margin-left:-20px;
  background:var(--tape); border:1.5px solid var(--tape-ink); border-top:0; border-radius:0 0 3px 3px}
.add{width:62px; height:62px; margin:0 16px 12px; border-radius:16px; background:var(--tape); color:var(--tape-ink);
  display:grid; place-items:center; border:1.5px solid var(--tape-ink); box-shadow:0 3px 0 var(--tape-ink);
  transform:translateY(-8px)}
.add:active{transform:translateY(-6px); box-shadow:0 1px 0 var(--tape-ink)}
.add svg{width:28px; height:28px}

/* ---------- ajanda: şerit metre ---------- */
.agenda{position:relative; --tw:60px}
.agenda::before{content:""; position:absolute; left:0; top:0; bottom:0; width:var(--tw);
  background:var(--tape); border-right:1.5px solid var(--tape-ink)}
.agenda::after{content:""; position:absolute; left:0; top:0; bottom:0; width:var(--tw); pointer-events:none;
  background:
    repeating-linear-gradient(to bottom, var(--tape-ink) 0 1.5px, transparent 1.5px 40px) right top / 13px 100% no-repeat,
    repeating-linear-gradient(to bottom, var(--tape-ink) 0 1px, transparent 1px 8px) right top / 7px 100% no-repeat;
  opacity:.82}
.day{position:relative; display:grid; grid-template-columns:var(--tw) minmax(0,1fr)}
.day-mark{position:relative; z-index:1; padding:13px 0 12px 10px; color:var(--tape-ink)}
.day-num{display:block; font-size:31px; line-height:.92; font-weight:790; font-stretch:62%;
  font-variant-numeric:tabular-nums}
.day-wd{display:block; font-size:12.5px; font-weight:680; font-stretch:78%; margin-top:3px}
.day.is-today .day-mark{align-self:start; background:var(--tape-ink); color:var(--tape); margin-right:1.5px}
.day.is-late .day-mark{padding:0}
.day.is-late .day-mark::before{content:""; position:absolute; inset:0 1.5px 0 0;
  background:repeating-linear-gradient(135deg, #C3271F 0 7px, var(--tape) 7px 15px)}
.day-body{padding-bottom:10px}
.day-h{display:flex; align-items:baseline; flex-wrap:wrap; gap:2px 8px; padding:14px 14px 4px; margin:0; font-size:15.5px; font-weight:720}
.day-h small{font-size:13.5px; font-weight:480; color:var(--muted)}
.day.is-late .day-h{color:var(--red)}
.day-none{padding:4px 14px 10px; margin:0; font-size:14.5px; color:var(--muted)}

/* ---------- satır ---------- */
.row{display:grid; grid-template-columns:46px minmax(0,1fr); border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom-color:transparent}
.st{width:46px; height:48px; display:grid; place-items:center; align-self:start; margin-top:2px; border-radius:8px; touch-action:manipulation}
.st i{width:22px; height:22px; border-radius:6px; border:1.75px solid var(--ink2); display:grid; place-items:center; transition:transform .12s}
.st:active i{transform:scale(.86)}
.st[data-st="doing"] i{border-color:var(--ink); background:linear-gradient(90deg, var(--tape) 0 50%, transparent 50%)}
.st[data-st="wait"] i{border-style:dashed}
.st[data-st="wait"] i::before{content:""; width:7px; height:9px; border:solid var(--ink2); border-width:0 2.5px}
.st[data-st="done"] i{background:var(--tape); border-color:var(--tape-ink)}
.st[data-st="done"] i::before{content:""; width:11px; height:6px; border:solid var(--tape-ink); border-width:0 0 2.5px 2.5px;
  transform:translateY(-1.5px) rotate(-45deg)}
.row-open{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:11px 14px 11px 0; min-height:52px; width:100%}
@media (hover:hover){ .row-open:hover .row-t{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px} }
.row-main{display:block; min-width:0}
.row-t{display:block; font-size:16px; font-weight:570; line-height:1.3; overflow-wrap:anywhere;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden}
.row-t.none{color:var(--muted); font-weight:450}
.row.is-done .row-t{color:var(--muted); font-weight:450; text-decoration:line-through; text-decoration-thickness:1.5px}
.row-x{display:block; font-size:14.5px; color:var(--muted); margin-top:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row-m{display:flex; flex-wrap:wrap; align-items:center; gap:5px 6px; margin-top:6px}
.row-m:empty{display:none}
.row-r{display:flex; flex-direction:column; align-items:flex-end; gap:5px; padding-top:1px}
.when{display:flex; align-items:center; gap:5px; font-size:15.5px; font-weight:740; font-stretch:72%;
  font-variant-numeric:tabular-nums; white-space:nowrap; line-height:1.25}
.when.sub{font-size:13px; font-weight:620; font-stretch:80%; color:var(--muted)}
.when.is-late{color:var(--red)}
.when svg{width:15px; height:15px; flex:none}
.when .unsent{color:var(--red)}
.mini{display:inline-flex; align-items:center; gap:3px; font-size:13px; font-weight:620; font-stretch:84%; color:var(--muted);
  font-variant-numeric:tabular-nums}
.mini svg{width:15px; height:15px}

/* ---------- etiket ---------- */
.chip{display:inline-flex; align-items:center; gap:5px; max-width:100%; font-size:12.5px; font-weight:640; font-stretch:86%;
  line-height:1; padding:4px 7px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:oklch(var(--chip-l) calc(var(--chip-c) * var(--on,1)) var(--h,0));
  color:oklch(var(--chip-tl) calc(var(--chip-tc) * var(--on,1)) var(--h,0))}
.h0{--on:0} .h1{--h:25} .h2{--h:55} .h3{--h:98} .h4{--h:150} .h5{--h:198} .h6{--h:256} .h7{--h:302} .h8{--h:352}
button.chip{min-height:38px; padding:0 11px; font-size:14.5px; border:1.5px solid transparent; flex:none}
button.chip[aria-pressed="true"]{border-color:currentColor; box-shadow:inset 0 0 0 1px currentColor; font-weight:740}
button.chip:disabled{opacity:.45; cursor:default}
button.chip[aria-pressed="true"]::before{content:""; width:9px; height:5px; border:solid currentColor; border-width:0 0 2px 2px;
  transform:translateY(-1.5px) rotate(-45deg); flex:none}
.swatch{width:22px; height:22px; border-radius:5px; flex:none; background:oklch(66% calc(.15 * var(--on,1)) var(--h,0))}

/* ---------- notlar ---------- */
.fbar{display:flex; gap:6px; overflow-x:auto; padding:10px 12px; scrollbar-width:none; border-bottom:1px solid var(--line2)}
.fbar::-webkit-scrollbar{display:none}
.seg{flex:none; height:38px; padding:0 13px; border-radius:6px; border:1px solid var(--line); background:var(--surface);
  font-size:14.5px; font-weight:620; color:var(--ink2); white-space:nowrap; display:inline-flex; align-items:center; gap:6px}
.seg[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.seg .n{font-weight:480; font-stretch:80%; font-variant-numeric:tabular-nums}
.sec-h{display:flex; align-items:center; gap:8px; padding:18px 14px 6px; margin:0; font-size:15.5px; font-weight:720}
.sec-h::before{content:""; width:5px; height:15px; background:var(--tape); border:1.5px solid var(--tape-ink); border-radius:1.5px; flex:none}
.sec-h small{font-weight:480; color:var(--muted); font-size:13.5px; flex:none}
.sec-h,.day-h,.tg-n{overflow-wrap:anywhere; min-width:0}   /* boşluksuz uzun adlar sayfayı genişletmesin */

.more{padding:16px 14px 8px; text-align:center}
.empty{padding:64px 28px 40px; text-align:center}
.empty h2{font-size:20px; font-weight:740; margin:0 0 6px}
.empty p{margin:0 auto 20px; max-width:34ch; color:var(--muted)}
.agenda .empty{padding:36px 20px 40px; text-align:left}
.agenda .empty p{margin-left:0}

/* ---------- düğmeler, alanlar ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:8px;
  font-weight:680; font-size:15px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); text-align:center}
.btn.pri{background:var(--tape); color:var(--tape-ink); border-color:var(--tape-ink); box-shadow:0 2px 0 var(--tape-ink)}
.btn.pri:active{transform:translateY(1px); box-shadow:0 1px 0 var(--tape-ink)}
.btn.quiet{border-color:var(--line); font-weight:620}
.btn.danger{border-color:var(--red); color:var(--red)}
.btn:disabled{opacity:.45; cursor:default; box-shadow:none}
.btn svg{width:18px; height:18px}
.btn.sm{min-height:38px; padding:0 12px; font-size:14.5px}
.in{height:44px; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:0 10px; font-size:16px; min-width:0}
select.in{max-width:100%}
textarea.in{height:auto; padding:10px; line-height:1.4; width:100%; resize:vertical;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.link{color:inherit; text-decoration:underline; text-underline-offset:3px; font-weight:620}
a.link{display:inline-flex; align-items:center; min-height:40px}

/* ---------- sayfa (dialog) ---------- */
dialog{border:0; padding:0; color:var(--ink); background:var(--surface); max-width:none; max-height:none}
dialog::backdrop{background:var(--scrim)}
.sheet{width:100%; margin:auto 0 0; max-height:94dvh; border-radius:16px 16px 0 0; overflow:hidden; flex-direction:column}
.sheet[open]{display:flex; animation:sheet-up .16s ease-out}
.sheet.tall{height:94dvh}
@keyframes sheet-up{from{transform:translateY(22px); opacity:0}}
@media (min-width:720px){
  .sheet{width:640px; margin:auto; border-radius:14px; max-height:88dvh}
  .sheet.tall{height:88dvh}
}
.sheet-h{display:flex; align-items:center; gap:4px; padding:8px 8px 8px 6px; border-bottom:1px solid var(--line2); flex:none}
.sheet-h h2{font-size:17.5px; font-weight:740; margin:0 0 0 6px; flex:1; min-width:0}
.sheet-h .state{flex:1; font-size:13.5px; color:var(--muted); padding-left:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sheet-b{overflow-y:auto; padding:0 16px calc(24px + var(--safe-b)); overscroll-behavior:contain; flex:1; min-height:0}
.ib[aria-pressed="true"]{color:var(--tape-ink); background:var(--tape)}

/* ---------- düzenleyici ---------- */
.ed-title{display:block; width:100%; border:0; background:transparent; outline:0; resize:none; overflow:hidden;
  font-size:22px; font-weight:700; line-height:1.25; padding:16px 0 4px}
.ed-body{display:block; width:100%; border:0; background:transparent; outline:0; resize:none; overflow:hidden;
  font-size:16px; line-height:1.5; padding:6px 0 16px; min-height:80px}
.ed-title::placeholder,.ed-body::placeholder{color:var(--muted); font-weight:450}
.fg{border-top:1px solid var(--line2); padding:14px 0 16px}
.fg.first{border-top:0}
.fg-l{display:flex; align-items:center; gap:6px; margin:0 0 9px; font-size:13.5px; font-weight:680; color:var(--muted)}
.fr{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.fr + .fr{margin-top:10px}
.grow{flex:1; min-width:0}
.stack{display:flex; flex-direction:column; gap:12px; margin-top:12px}
.stack:empty{display:none}
.stack > *{margin:0}
.mt{margin-top:14px}
.w-num{width:84px}
.fr-l{flex:none; width:72px; font-size:14.5px; color:var(--ink2); font-weight:560}
.note{margin:8px 0 0; font-size:14px; line-height:1.4; color:var(--muted); display:flex; gap:7px; align-items:flex-start}
.note svg{width:16px; height:16px; flex:none; margin-top:2px}
.note.bad{color:var(--red)}
.note.ok{color:var(--ink2)}
.stseg{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px}
.stseg button{display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 2px 8px; border:1px solid var(--line);
  border-radius:8px; font-size:13.5px; font-weight:620; color:var(--ink2); text-align:center; line-height:1.25}
.stseg button .st{width:30px; height:32px; margin:0; pointer-events:none; align-self:center}
.stseg button[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); color:var(--ink)}
.tg-g{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px}
.tg-g:first-of-type{margin-top:0}
.tg-n{flex:none; width:100%; font-size:13px; font-weight:620; color:var(--ink2); margin-bottom:-1px}
.tg-new{margin-top:14px}
.tg-new > input{flex:1 1 10em}
.swatch-plus{width:22px; height:22px; flex:none; color:var(--muted); padding:2px}
.cl{list-style:none; margin:0; padding:0}
.cl li{display:grid; grid-template-columns:34px minmax(0,1fr) 38px; align-items:center}
.cl-ck{display:grid; place-items:center; width:34px; height:42px; cursor:pointer}
.cl input[type=checkbox]{width:20px; height:20px; margin:0; accent-color:var(--tape)}
.cl input[type=text]{border:0; border-bottom:1px solid transparent; background:transparent; height:42px; font-size:16px; outline:0; min-width:0; width:100%}
.cl input[type=text]:focus{border-bottom-color:var(--line)}
.cl li.is-done input[type=text]{color:var(--muted); text-decoration:line-through}
.cl .ib{width:38px; height:38px; color:var(--muted)}
.cl .ib svg{width:17px; height:17px}
.cl-add{display:grid; grid-template-columns:34px minmax(0,1fr); align-items:center; color:var(--muted)}
.cl-add svg{width:18px; height:18px; margin-left:3px}

/* ---------- ayarlar ---------- */

.steps > li.is-off::before{border-color:var(--line); color:var(--muted)}

dialog .toast{bottom:calc(24px + var(--safe-b))}

@media (prefers-reduced-motion:reduce){

/* ======================= 8 · uygulama içi alarm ======================= */
/* Uygulama açıkken vakti gelen hatırlatmayı ekranda gösterir. Takvim'de aynı alarm duruyorsa sistem bildirimi
   atmaz (telefon zaten Takvim'den bildirir); durmuyorsa ve izin varsa sistem bildirimi de gösterir. */
const Alarm = {
  timer: 0, GRACE: 15 * 60000,
  start() { clearInterval(Alarm.timer); Alarm.timer = setInterval(Alarm.tick, 20000); Alarm.tick(); },
  /* occ: m dakika önceki hatırlatması en son ne zaman çalması gereken tekrarın anı. Tekrarlı not işaretlenmedikçe
     kayıtlı tarihi eskide kalır; Takvim'deki seri ise her tekrarda çalar. Uygulama içi alarm da öyle davranır. */
  occ(n, m, now) {
    let at = dueAt(n);
    if (!n.rep || at - m * 60000 >= now - Alarm.GRACE) return at;
    const tz = n.tz || DEV_TZ, back = addDays(today(), -2);
    let d = n.due.d;
    if (d < back) {                                        // çok eskide kalmış seri: bugüne yakın bir tekrara atla
      if (n.rep === "daily") d = back;
      else if (n.rep === "weekly") d = addDays(d, Math.floor(dayDiff(back, d) / 7) * 7);
      else if (n.rep === "weekdays") { d = back; while ([0, 6].includes(parseYmd(d).getDay())) d = addDays(d, 1); }
      at = zonedToUtc(d, n.due.t, tz);
    }
    for (let i = 0; i < 400; i++) {
      const nx = stepDate(d, n.rep);
      if (nx === d) break;
      const t2 = zonedToUtc(nx, n.due.t, tz);
      if (t2 - m * 60000 > now) break;
      d = nx; at = t2;
    }
    return at;
  },
  tick() {
    const now = Date.now(), fired = KV.obj("fired") || {};
    let dirty = false;
    for (const k in fired) if (!(now - fired[k] <= 2 * 864e5)) { delete fired[k]; dirty = true; }
    for (const n of S.notes.values()) {
      if (n.del || n.st === "done" || !n.due || !isHm(n.due.t)) continue;
      let hit = 0;
      for (const m of cleanRems(n.rem)) {
        const at = Alarm.occ(n, m, now), fire = at - m * 60000;
        if (fire > now || now - fire > Alarm.GRACE) continue;
        const key = n.id + "|" + at + "|" + m;
        if (fired[key]) continue;
        fired[key] = now; dirty = true; hit = at;
      }
      if (hit) Alarm.ring(n, hit);                        // aynı anda vakti gelen birden çok hatırlatma tek kez çalar
    }
    if (dirty) KV.set("fired", fired);
  },
  when(at) {                                             // çalan tekrarın cihaz saatiyle günü ve saati
    const x = new Date(at), d = ymd(x);
    return { d, t: pad(x.getHours()) + ":" + pad(x.getMinutes()), day: d === today() ? "" : relDay(d) };
  },
  ring(n, at) {
    UI.rings = UI.rings.filter((r) => r.id !== n.id).concat({ id: n.id, at }).slice(-3);
    invalidate();
    const w = Alarm.when(at), line = w.t + " · " + calTitle(n) + (w.day ? " (" + w.day + ")" : "");
    try { if (navigator.vibrate) navigator.vibrate([180, 90, 180]); } catch (e) {}
    if (topSheet()) toast(line, null, null, 8000);        // bir sayfa açıkken kart arkada kalır: önde de haber ver
    if (Cal.covers(n) || !("Notification" in window) || Notification.permission !== "granted") return;
    const title = calTitle(n), opts = { body: (w.day ? w.day + " " : "") + w.t, tag: NS + "-" + n.id, renotify: true, icon: "./icon-192.png", data: { id: n.id } };
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then((reg) => reg.showNotification(title, opts)).catch(() => {});
      else new Notification(title, opts);
    } catch (e) {}
  },
  dismiss(id) { UI.rings = UI.rings.filter((r) => r.id !== id); invalidate(); },
  async ask() {
    if (!("Notification" in window)) return;
    try { await Notification.requestPermission(); } catch (e) {}
    refresh();
  }
};

const Backup = {

    const blob = new Blob([JSON.stringify({ app: NS, v: 1, at: new Date().toISOString(), items }, null, 1)], { type: "application/json" });
    const a = h("a", { href: URL.createObjectURL(blob), download: NS + "-yedek-" + today() + ".json" });

  /* yükleme: eksik ve silinmiş kayıtlar geri gelir; yerelde aynı ya da daha yeni olan kayda dokunulmaz.
     Bu cihazda olmayan ya da eski kalmış kayıt, yedekteki sürüm damgasıyla girer: bulutta daha yenisi (ya da
     silinmişi) varsa eşitlemede o kazanır. Yalnızca bu cihazda silinmiş olan, bilerek geri getirildiği için

    let count = 0;

   Kapanış kuralları:

   - Yeni not, yazısı yoksa yalnızca kullanıcı bilerek bir şey verdiyse kalır: tarih/saat, etiket, durum ya da
     sabitleme ("başlıksız" görünür). Ajandadan ya da süzgeç açıkken gelen hazır tarih, etiket ve durum sayılmaz.
   - Var olan not, açıldığında yazılıydı ve yazısının tamamı silindiyse silinir (geri alınabilir; "Geri al" yazılı

let chan = null;
function openFromHash() {
  const m = /^#n=([0-9a-v]{5,64})$/.exec(location.hash || "");

  try { history.replaceState(history.state, "", location.pathname + location.search); } catch (e) {}

async function boot() {
  applyTheme();
  document.documentElement.lang = lang;
  buildShell();
  if (await DB.open()) {                                  // veritabanı açılırken yapılmış bir değişiklik varsa (yavaş cihaz) bellekteki geçerlidir

    for (const it of await DB.all("items")) {
      try { if (validItem(it)) { const cur = S.items.get(keyOf(it)); if (!cur || cmpVer(it, cur) > 0) index(it); } }
      catch (e) { console.warn("[centik] bozuk kayıt atlandı", e); }
    }
  } else DB.dead = true;
  S.device = KV.get("device", "");
  if (typeof S.device !== "string" || !S.device) { S.device = newId().slice(9); KV.set("device", S.device); }
  const ui = KV.get("ui", null);
  if (ui && typeof ui === "object") {
    UI.tab = ui.tab === "notes" ? "notes" : "agenda";
    UI.status = ["active", "all"].concat(STATUSES).includes(ui.status) ? ui.status : "active";
    UI.tagSel = new Set((Array.isArray(ui.tagSel) ? ui.tagSel : []).filter(liveTag));
    UI.groupBy = typeof ui.groupBy === "string" ? ui.groupBy : "";
    UI.hintOff = !!ui.hintOff;
  }
  render();

  try {                                                   // aynı cihazdaki diğer sekmeler

      const key = e.data && e.data.key; if (typeof key !== "string") return;
      const it = await DB.get("items", key), cur = S.items.get(key);
      if (it === undefined) return;                       // okunamadı: "silinmiş" sayılmaz
      if (!it) { if (cur) { unindex(key); invalidate(); } return; }
      if (!validItem(it)) return;
      const c = cur ? cmpVer(it, cur) : 1;
      if (c < 0) { persist(cur); return; }                // iki sekme aynı anda yazdı ve diskte eskisi kaldı: yenisi yeniden yazılır
      index(it); invalidate();
      if (c > 0 && it.k === "n" && Ed.n && Ed.n.id === it.id) Ed.remote(it);
    };
  } catch (e) {}

  window.addEventListener("hashchange", openFromHash);
  window.addEventListener("online", () => { if (getCfg() && !Cloud.ready) Cloud.init(); Cloud.flush(true); Cal.kick({}); refresh(); });
  window.addEventListener("offline", refresh);
  document.addEventListener("visibilitychange", () => {

    navigator.serviceWorker.register("./sw.js").then((reg) => { if (navigator.onLine && reg.active) reg.active.postMessage({ type: "warm", sdk: FB_VER }); }).catch(() => {});
